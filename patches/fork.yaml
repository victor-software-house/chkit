      - chkit_python/tests/**
      - .changeset/**
      - packages/cli/src/commands/drift/**
      - chkit_python/src/chkit/cli/commands/**
  - name: text-index-type
    kind: source
    purpose: >-
      Model the ClickHouse text index (GA since 26.2) as a skip index type so schemas
      can declare, pull, migrate, and drift-check it.
    upstream_status: submitted
    drop_when: "obsessiondb/chkit#212 (https://github.com/obsessiondb/chkit/pull/212) is merged and the base is rebased past it."
    scope:
      - packages/core/src/**
