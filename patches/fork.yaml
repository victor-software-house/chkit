      - packages/clickhouse/src/**
      - packages/plugin-obsessiondb/src/**
      - packages/cli/src/test/**
      - chkit_python/src/chkit/clickhouse/**
      - chkit_python/tests/**
      - .changeset/**
      - packages/cli/src/commands/drift/**
  - name: fork-bookkeeping
    kind: tooling
    purpose: Own fork policy, generated evidence, and integration configuration.
    upstream_status: "inappropriate: downstream-only fork maintenance"
    drop_when: The downstream fork is retired.
    scope:
      - patches/fork.yaml
      - patches/LEDGER.md
      - patches/exports/**
      - mise.toml
