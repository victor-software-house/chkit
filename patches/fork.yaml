    purpose: >-
      Drift and pull read index arguments from
      system.data_skipping_indices.type_full; type holds only the name, so every parameterised index showed as changed.
    upstream_status: submitted
    drop_when: "obsessiondb/chkit#211 (https://github.com/obsessiondb/chkit/pull/211) is merged and the base is rebased past it."
    scope:
      - packages/clickhouse/src/**
